<!DOCTYPE html>
<html>
<head>
<title>Admin</title>

<style>
body{
font-family:Arial;
text-align:center;
padding:50px;
background:#f2f2f2;
}

.box{
background:white;
padding:30px;
border-radius:15px;
width:300px;
margin:auto;
}

input{
display:block;
margin:10px auto;
padding:10px;
width:90%;
}

button{
background:#0066ff;
color:white;
padding:10px 30px;
border:0;
border-radius:10px;
}
</style>

</head>

<body>

<div class="box">

<h2>Admin Login</h2>

<input id="user" placeholder="Tài khoản">

<input id="pass" type="password" placeholder="Mật khẩu">

<button onclick="login()">Đăng nhập</button>

</div>


<script>

function login(){

let user=document.getElementById("user").value;
let pass=document.getElementById("pass").value;


if(user=="admin" && pass=="123456"){

alert("Đăng nhập thành công");

location.href="quan-ly.html";

}

else{

alert("Sai tài khoản hoặc mật khẩu");

}

}

</script>


</body>
</html>
